<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1180 700' width='1180' height='700' role='img' aria-label='SemiBlock grid standard'><rect width='100%' height='100%' fill='#f7f9fd'/><defs><marker id='d' markerWidth='10' markerHeight='10' refX='5' refY='5' orient='auto-start-reverse'><path d='M0,1 L9,5 L0,9' fill='none' stroke='#0f172a' stroke-width='1.5'/></marker></defs><text x='40.0' y='52.0' font-family='Arial, Helvetica, sans-serif' font-size='26' fill='#0f172a' text-anchor='start' font-weight='bold'>SemiBlock grid standard (Technic-compatible)</text><text x='40.0' y='84.0' font-family='Arial, Helvetica, sans-serif' font-size='17' fill='#5a6678' text-anchor='start' font-weight='normal'>Every beam, connector and module housing follows these numbers. mm, drawn to scale.</text><rect x='16.0' y='176.0' width='468.0' height='148.0' rx='74.0' fill='#dbe7fb' stroke='#1f6fe5' stroke-width='2'/><circle cx='90.0' cy='250.0' r='62.0' fill='#eef3fb' stroke='#1f6fe5' stroke-width='1.5'/><circle cx='90.0' cy='250.0' r='48.5' fill='#f7f9fd' stroke='#0f172a' stroke-width='2'/><circle cx='250.0' cy='250.0' r='62.0' fill='#eef3fb' stroke='#1f6fe5' stroke-width='1.5'/><circle cx='250.0' cy='250.0' r='48.5' fill='#f7f9fd' stroke='#0f172a' stroke-width='2'/><circle cx='410.0' cy='250.0' r='62.0' fill='#eef3fb' stroke='#1f6fe5' stroke-width='1.5'/><circle cx='410.0' cy='250.0' r='48.5' fill='#f7f9fd' stroke='#0f172a' stroke-width='2'/><text x='16.0' y='116.0' font-family='Arial, Helvetica, sans-serif' font-size='18' fill='#0f172a' text-anchor='start' font-weight='bold'>Top view - H-beam 1x3 (H-section between the holes)</text><line x1='90.0' y1='154.0' x2='250.0' y2='154.0' stroke='#0f172a' stroke-width='1.5' marker-start='url(#d)' marker-end='url(#d)'/><text x='170.0' y='146.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#0f172a' text-anchor='middle' font-weight='normal'>pitch 8.0</text><line x1='361.5' y1='354.0' x2='458.5' y2='354.0' stroke='#0f172a' stroke-width='1.5' marker-start='url(#d)' marker-end='url(#d)'/><text x='410.0' y='346.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#0f172a' text-anchor='middle' font-weight='normal'>hole 4.85</text><line x1='188.0' y1='392.0' x2='312.0' y2='392.0' stroke='#1f6fe5' stroke-width='1.5' marker-start='url(#d)' marker-end='url(#d)'/><text x='250.0' y='384.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1f6fe5' text-anchor='middle' font-weight='normal'>counterbore 6.2</text><line x1='508.0' y1='176.0' x2='508.0' y2='324.0' stroke='#0f172a' stroke-width='1.5' marker-start='url(#d)' marker-end='url(#d)'/><text x='518.0' y='255.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#0f172a' text-anchor='start' font-weight='normal'>width 7.4</text><rect x='720.0' y='170.0' width='256.0' height='156.0' fill='#dbe7fb' stroke='#1f6fe5' stroke-width='2'/><rect x='786.0' y='170.0' width='124.0' height='14.0' fill='#f7f9fd'/><rect x='786.0' y='312.0' width='124.0' height='14.0' fill='#f7f9fd'/><rect x='799.5' y='170.0' width='97.0' height='156.0' fill='#f7f9fd'/><rect x='720.0' y='330.0' width='256.0' height='156.0' fill='#fff3cf' stroke='#b8860b' stroke-width='2'/><rect x='786.0' y='330.0' width='124.0' height='14.0' fill='#f7f9fd'/><rect x='786.0' y='472.0' width='124.0' height='14.0' fill='#f7f9fd'/><rect x='799.5' y='330.0' width='97.0' height='156.0' fill='#f7f9fd'/><text x='720.0' y='130.0' font-family='Arial, Helvetica, sans-serif' font-size='18' fill='#0f172a' text-anchor='start' font-weight='bold'>Section - two stacked beams</text><line x1='694.0' y1='170.0' x2='694.0' y2='326.0' stroke='#0f172a' stroke-width='1.5' marker-start='url(#d)' marker-end='url(#d)'/><text x='684.0' y='253.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#0f172a' text-anchor='end' font-weight='normal'>thickness 7.8</text><text x='684.0' y='328.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#0f172a' text-anchor='end' font-weight='normal'>gap 0.2</text><line x1='1002.0' y1='170.0' x2='1002.0' y2='184.0' stroke='#c8209e' stroke-width='1.5' marker-start='url(#d)' marker-end='url(#d)'/><text x='1012.0' y='182.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#c8209e' text-anchor='start' font-weight='normal'>counterbore 0.7 deep</text><text x='1012.0' y='206.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#c8209e' text-anchor='start' font-weight='normal'>= TwistLock lip seat</text><polygon points='324.0,531.2 371.2,531.2 371.2,484.0 428.8,484.0 428.8,531.2 476.0,531.2 476.0,588.8 428.8,588.8 428.8,636.0 371.2,636.0 371.2,588.8 324.0,588.8' fill='#3a4049' stroke='#0f172a' stroke-width='1.5'/><text x='400.0' y='450.0' font-family='Arial, Helvetica, sans-serif' font-size='18' fill='#0f172a' text-anchor='middle' font-weight='bold'>Axle cross (x1.6)</text><line x1='324.0' y1='666.0' x2='476.0' y2='666.0' stroke='#0f172a' stroke-width='1.5' marker-start='url(#d)' marker-end='url(#d)'/><text x='400.0' y='658.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#0f172a' text-anchor='middle' font-weight='normal'>4.75 tip to tip</text><text x='506.0' y='566.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#0f172a' text-anchor='start' font-weight='normal'>arm 1.8</text><text x='700.0' y='560.0' font-family='Arial, Helvetica, sans-serif' font-size='18' fill='#0f172a' text-anchor='start' font-weight='bold'>Rules</text><text x='700.0' y='592.0' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='#0f172a' text-anchor='start' font-weight='normal'>- 1 module = 8.0 mm in X, Y and Z</text><text x='700.0' y='616.0' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='#0f172a' text-anchor='start' font-weight='normal'>- part size = n x 8 - 0.2 mm (0.1 clearance per face)</text><text x='700.0' y='640.0' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='#0f172a' text-anchor='start' font-weight='normal'>- every round hole has the 6.2 x 0.7 counterbore</text><text x='700.0' y='664.0' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='#0f172a' text-anchor='start' font-weight='normal'>- module housings: holes on the same 8 mm grid</text><text x='700.0' y='688.0' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='#0f172a' text-anchor='start' font-weight='normal'>- gears: module 1 -> 8/16/24/40 T mesh on the grid</text></svg>