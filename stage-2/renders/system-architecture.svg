<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1180 760' width='1180' height='760' role='img' aria-label='SemiBlock Junior system architecture'><rect width='100%' height='100%' fill='#f7f9fd'/><defs><marker id='a' markerWidth='9' markerHeight='9' refX='5' refY='4.5' orient='auto-start-reverse'><path d='M0,0 L9,4.5 L0,9 z' fill='#0f172a'/></marker></defs><text x='40.0' y='52.0' font-family='Arial, Helvetica, sans-serif' font-size='26' fill='#0f172a' text-anchor='start' font-weight='bold'>System architecture</text><text x='40.0' y='84.0' font-family='Arial, Helvetica, sans-serif' font-size='17' fill='#5a6678' text-anchor='start' font-weight='normal'>One code path from the semiblock.ai editor to every motor and sensor.</text><rect x='30' y='120' width='290' height='190' rx='14' fill='#ffffff' stroke='#c8209e' stroke-width='2.5'/><rect x='30' y='120' width='290' height='8' rx='4' fill='#c8209e'/><text x='48.0' y='158.0' font-family='Arial, Helvetica, sans-serif' font-size='19' fill='#0f172a' text-anchor='start' font-weight='bold'>semiblock.ai (browser)</text><text x='48.0' y='186.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#5a6678' text-anchor='start' font-weight='normal'>blocks + MicroPython editor</text><text x='48.0' y='209.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#5a6678' text-anchor='start' font-weight='normal'>simulator / digital twin</text><text x='48.0' y='232.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#5a6678' text-anchor='start' font-weight='normal'>class dashboard, data logs</text><text x='48.0' y='255.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#5a6678' text-anchor='start' font-weight='normal'>AI model training</text><rect x='430' y='120' width='320' height='210' rx='14' fill='#ffffff' stroke='#1f6fe5' stroke-width='2.5'/><rect x='430' y='120' width='320' height='8' rx='4' fill='#1f6fe5'/><text x='448.0' y='158.0' font-family='Arial, Helvetica, sans-serif' font-size='19' fill='#0f172a' text-anchor='start' font-weight='bold'>Junior Brain (ESP32-S3)</text><text x='448.0' y='186.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#5a6678' text-anchor='start' font-weight='normal'>MicroPython runtime + device ID</text><text x='448.0' y='209.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#5a6678' text-anchor='start' font-weight='normal'>1.54 in screen, 3 buttons, RGB</text><text x='448.0' y='232.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#5a6678' text-anchor='start' font-weight='normal'>IMU, mic, speaker, light sensor</text><text x='448.0' y='255.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#5a6678' text-anchor='start' font-weight='normal'>2S Li-ion, USB-C charge</text><text x='448.0' y='278.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#5a6678' text-anchor='start' font-weight='normal'>6 SemiLink ports (A-F)</text><rect x='860' y='120' width='290' height='190' rx='14' fill='#ffffff' stroke='#12a89a' stroke-width='2.5'/><rect x='860' y='120' width='290' height='8' rx='4' fill='#12a89a'/><text x='878.0' y='158.0' font-family='Arial, Helvetica, sans-serif' font-size='19' fill='#0f172a' text-anchor='start' font-weight='bold'>Other robots / remotes</text><text x='878.0' y='186.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#5a6678' text-anchor='start' font-weight='normal'>ESP-NOW messages</text><text x='878.0' y='209.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#5a6678' text-anchor='start' font-weight='normal'>BLE gamepads</text><text x='878.0' y='232.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#5a6678' text-anchor='start' font-weight='normal'>Wi-Fi for IoT lessons</text><line x1='320' y1='215' x2='430' y2='215' stroke='#0f172a' stroke-width='2.5' marker-end='url(#a)' marker-start='url(#a)'/><text x='375.0' y='200.0' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#5a6678' text-anchor='middle' font-weight='normal'>USB-C / BLE</text><text x='375.0' y='245.0' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#5a6678' text-anchor='middle' font-weight='normal'>Wi-Fi</text><line x1='750' y1='215' x2='860' y2='215' stroke='#0f172a' stroke-width='2.5' marker-end='url(#a)' marker-start='url(#a)'/><text x='805.0' y='200.0' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#5a6678' text-anchor='middle' font-weight='normal'>ESP-NOW</text><rect x='30' y='430' width='290' height='200' rx='14' fill='#ffffff' stroke='#e6a000' stroke-width='2.5'/><rect x='30' y='430' width='290' height='8' rx='4' fill='#e6a000'/><text x='48.0' y='468.0' font-family='Arial, Helvetica, sans-serif' font-size='19' fill='#0f172a' text-anchor='start' font-weight='bold'>SemiMotor M / L / Servo</text><text x='48.0' y='496.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#5a6678' text-anchor='start' font-weight='normal'>H-bridge on the port</text><text x='48.0' y='519.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#5a6678' text-anchor='start' font-weight='normal'>encoder: speed + angle</text><text x='48.0' y='542.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#5a6678' text-anchor='start' font-weight='normal'>2 ports: daisy-chain</text><text x='48.0' y='565.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#5a6678' text-anchor='start' font-weight='normal'>auto-detected by ID</text><rect x='430' y='430' width='320' height='230' rx='14' fill='#ffffff' stroke='#1f6fe5' stroke-width='2.5'/><rect x='430' y='430' width='320' height='8' rx='4' fill='#1f6fe5'/><text x='448.0' y='468.0' font-family='Arial, Helvetica, sans-serif' font-size='19' fill='#0f172a' text-anchor='start' font-weight='bold'>Smart modules (60+)</text><text x='448.0' y='496.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#5a6678' text-anchor='start' font-weight='normal'>tiny MCU in every module</text><text x='448.0' y='519.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#5a6678' text-anchor='start' font-weight='normal'>same I2C protocol + ID</text><text x='448.0' y='542.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#5a6678' text-anchor='start' font-weight='normal'>auto-detect, safe hot-plug</text><text x='448.0' y='565.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#5a6678' text-anchor='start' font-weight='normal'>calibration stored on module</text><text x='448.0' y='588.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#5a6678' text-anchor='start' font-weight='normal'>2 ports: chain up to 8</text><rect x='860' y='430' width='290' height='200' rx='14' fill='#ffffff' stroke='#0f172a' stroke-width='2.5'/><rect x='860' y='430' width='290' height='8' rx='4' fill='#0f172a'/><text x='878.0' y='468.0' font-family='Arial, Helvetica, sans-serif' font-size='19' fill='#0f172a' text-anchor='start' font-weight='bold'>SemiLink-6 cable</text><text x='878.0' y='496.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#5a6678' text-anchor='start' font-weight='normal'>1 M+  2 M-  3 GND</text><text x='878.0' y='519.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#5a6678' text-anchor='start' font-weight='normal'>4 VCC 3.3/5 V</text><text x='878.0' y='542.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#5a6678' text-anchor='start' font-weight='normal'>5 SDA/TX/encA  6 SCL/RX/encB</text><text x='878.0' y='565.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#5a6678' text-anchor='start' font-weight='normal'>keyed + latched, replaceable</text><line x1='540' y1='330' x2='200' y2='430' stroke='#0f172a' stroke-width='2.5' marker-end='url(#a)' marker-start='url(#a)'/><text x='378.0' y='372.0' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#5a6678' text-anchor='start' font-weight='normal'>ports A-F</text><line x1='590' y1='330' x2='590' y2='430' stroke='#0f172a' stroke-width='2.5' marker-end='url(#a)' marker-start='url(#a)'/><text x='598.0' y='372.0' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#5a6678' text-anchor='start' font-weight='normal'>ports A-F</text><line x1='750' y1='540' x2='860' y2='540' stroke='#0f172a' stroke-width='2.5' marker-end='url(#a)' marker-start='url(#a)'/><text x='440.0' y='700.0' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='#0f172a' text-anchor='start' font-weight='bold'>Same physical port for motors and sensors: kids never pick the wrong one.</text></svg>