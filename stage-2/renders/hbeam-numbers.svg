<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1180 700' width='1180' height='700' role='img' aria-label='H-beam section compared with the stage-1 solid beam'><rect width='100%' height='100%' fill='#f7f9fd'/><defs><marker id='d' markerWidth='10' markerHeight='10' refX='5' refY='5' orient='auto-start-reverse'><path d='M0,1 L9,5 L0,9' fill='none' stroke='#0f172a' stroke-width='1.5'/></marker></defs><text x='40.0' y='52.0' font-family='Arial, Helvetica, sans-serif' font-size='26' fill='#0f172a' text-anchor='start' font-weight='bold'>H-beam section (stage 2) vs solid beam (stage 1)</text><text x='40.0' y='84.0' font-family='Arial, Helvetica, sans-serif' font-size='17' fill='#5a6678' text-anchor='start' font-weight='normal'>Cut between two holes. Same outside size, holes and counterbores, so every pin and LEGO part still fits. mm, drawn to scale.</text><rect x='93.8' y='198.6' width='192.4' height='202.8' fill='#e3e7ee' stroke='#5a6678' stroke-width='2'/><text x='190.0' y='158.6' font-family='Arial, Helvetica, sans-serif' font-size='18' fill='#0f172a' text-anchor='middle' font-weight='bold'>Stage 1: solid</text><line x1='93.8' y1='435.4' x2='286.2' y2='435.4' stroke='#0f172a' stroke-width='1.5' marker-start='url(#d)' marker-end='url(#d)'/><text x='190.0' y='427.4' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#0f172a' text-anchor='middle' font-weight='normal'>7.4</text><line x1='67.8' y1='198.6' x2='67.8' y2='401.4' stroke='#0f172a' stroke-width='1.5' marker-start='url(#d)' marker-end='url(#d)'/><text x='57.8' y='305.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#0f172a' text-anchor='end' font-weight='normal'>7.8</text><path d='M463.8,401.4 L656.2,401.4 L656.2,354.6 L593.8,354.6 A13.0,13.0 0 0 0 580.8,341.6 L580.8,258.4 A13.0,13.0 0 0 0 593.8,245.4 L656.2,245.4 L656.2,198.6 L463.8,198.6 L463.8,245.4 L526.2,245.4 A13.0,13.0 0 0 0 539.2,258.4 L539.2,341.6 A13.0,13.0 0 0 0 526.2,354.6 L463.8,354.6 Z' fill='#dbe7fb' stroke='#1f6fe5' stroke-width='2'/><text x='560.0' y='158.6' font-family='Arial, Helvetica, sans-serif' font-size='18' fill='#1f6fe5' text-anchor='middle' font-weight='bold'>Stage 2: H-section</text><line x1='463.8' y1='435.4' x2='656.2' y2='435.4' stroke='#0f172a' stroke-width='1.5' marker-start='url(#d)' marker-end='url(#d)'/><text x='560.0' y='427.4' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#0f172a' text-anchor='middle' font-weight='normal'>7.4</text><line x1='437.8' y1='198.6' x2='437.8' y2='401.4' stroke='#0f172a' stroke-width='1.5' marker-start='url(#d)' marker-end='url(#d)'/><text x='427.8' y='305.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#0f172a' text-anchor='end' font-weight='normal'>7.8</text><line x1='678.2' y1='198.6' x2='678.2' y2='245.4' stroke='#1f6fe5' stroke-width='1.5' marker-start='url(#d)' marker-end='url(#d)'/><text x='688.2' y='227.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1f6fe5' text-anchor='start' font-weight='normal'>flange 1.8</text><line x1='728.2' y1='245.4' x2='728.2' y2='354.6' stroke='#5a6678' stroke-width='1.5' marker-start='url(#d)' marker-end='url(#d)'/><text x='738.2' y='305.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#5a6678' text-anchor='start' font-weight='normal'>pocket 4.2</text><line x1='539.2' y1='288.0' x2='580.8' y2='288.0' stroke='#0f172a' stroke-width='1.5' marker-start='url(#d)' marker-end='url(#d)'/><text x='560.0' y='280.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#0f172a' text-anchor='middle' font-weight='normal'></text><text x='531.2' y='294.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#0f172a' text-anchor='end' font-weight='normal'>web 1.6</text><line x1='580.8' y1='326.0' x2='656.2' y2='326.0' stroke='#5a6678' stroke-width='1.5' marker-start='url(#d)' marker-end='url(#d)'/><text x='618.5' y='318.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#5a6678' text-anchor='middle' font-weight='normal'>2.9 deep</text><text x='560.0' y='471.4' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#5a6678' text-anchor='middle' font-weight='normal'>tube round every hole: wall 0.98</text><line x1='353' y1='240' x2='353' y2='360' stroke='#c8209e' stroke-width='2' marker-start='url(#d)' marker-end='url(#d)'/><text x='343.8' y='230.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#c8209e' text-anchor='middle' font-weight='normal'>pin axis</text><text x='800.0' y='170.0' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='#0f172a' text-anchor='start' font-weight='bold'></text><text x='975.0' y='170.0' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='#0f172a' text-anchor='start' font-weight='bold'>Stage 1</text><text x='1045.0' y='170.0' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='#1f6fe5' text-anchor='start' font-weight='bold'>Stage 2</text><text x='800.0' y='190.0' font-family='Arial, Helvetica, sans-serif' font-size='13' fill='#5a6678' text-anchor='start' font-weight='normal'></text><line x1='800' y1='186' x2='1160' y2='186' stroke='#d6dde8' stroke-width='1'/><text x='800.0' y='216.0' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='#0f172a' text-anchor='start' font-weight='normal'>Plastic in a 1x15 beam</text><text x='975.0' y='216.0' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='#0f172a' text-anchor='start' font-weight='normal'>100%</text><text x='1045.0' y='216.0' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='#1f6fe5' text-anchor='start' font-weight='bold'>74%</text><text x='800.0' y='236.0' font-family='Arial, Helvetica, sans-serif' font-size='13' fill='#5a6678' text-anchor='start' font-weight='normal'>26% less</text><line x1='800' y1='232' x2='1160' y2='232' stroke='#d6dde8' stroke-width='1'/><text x='800.0' y='262.0' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='#0f172a' text-anchor='start' font-weight='normal'>Stiffness lying flat</text><text x='975.0' y='262.0' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='#0f172a' text-anchor='start' font-weight='normal'>100%</text><text x='1045.0' y='262.0' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='#1f6fe5' text-anchor='start' font-weight='bold'>91%</text><text x='800.0' y='282.0' font-family='Arial, Helvetica, sans-serif' font-size='13' fill='#5a6678' text-anchor='start' font-weight='normal'>load along the holes</text><line x1='800' y1='278' x2='1160' y2='278' stroke='#d6dde8' stroke-width='1'/><text x='800.0' y='308.0' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='#0f172a' text-anchor='start' font-weight='normal'>Stiffness on edge</text><text x='975.0' y='308.0' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='#0f172a' text-anchor='start' font-weight='normal'>100%</text><text x='1045.0' y='308.0' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='#1f6fe5' text-anchor='start' font-weight='bold'>63%</text><text x='800.0' y='328.0' font-family='Arial, Helvetica, sans-serif' font-size='13' fill='#5a6678' text-anchor='start' font-weight='normal'>load across the holes</text><line x1='800' y1='324' x2='1160' y2='324' stroke='#d6dde8' stroke-width='1'/><text x='800.0' y='354.0' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='#0f172a' text-anchor='start' font-weight='normal'>Strength at the holes</text><text x='975.0' y='354.0' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='#0f172a' text-anchor='start' font-weight='normal'>100%</text><text x='1045.0' y='354.0' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='#1f6fe5' text-anchor='start' font-weight='bold'>~85%</text><text x='800.0' y='374.0' font-family='Arial, Helvetica, sans-serif' font-size='13' fill='#5a6678' text-anchor='start' font-weight='normal'>weakest section</text><line x1='800' y1='370' x2='1160' y2='370' stroke='#d6dde8' stroke-width='1'/><text x='800.0' y='400.0' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='#0f172a' text-anchor='start' font-weight='normal'>Thickest wall</text><text x='975.0' y='400.0' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='#0f172a' text-anchor='start' font-weight='normal'>3.2 mm</text><text x='1045.0' y='400.0' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='#1f6fe5' text-anchor='start' font-weight='bold'>1.8 mm</text><text x='800.0' y='420.0' font-family='Arial, Helvetica, sans-serif' font-size='13' fill='#5a6678' text-anchor='start' font-weight='normal'>~1/3 the cooling time</text><text x='800.0' y='470.0' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='#0f172a' text-anchor='start' font-weight='normal'>Lying flat (holes vertical) the H is stiffer per gram</text><text x='800.0' y='494.0' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='#0f172a' text-anchor='start' font-weight='normal'>than the solid beam. On edge it is softer: brace long</text><text x='800.0' y='518.0' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='#0f172a' text-anchor='start' font-weight='normal'>rails with a frame or a triangle (section 6).</text><text x='40.0' y='670.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#5a6678' text-anchor='start' font-weight='normal'>Numbers measured on the stage-2 CAD (section properties averaged along one 8 mm pitch). To confirm with 3-point bending tests (prototype plan).</text></svg>